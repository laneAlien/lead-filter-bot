services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - hf_cache:/app/.cache/huggingface

volumes:
  redis_data:
  hf_cache:
