[project]
name = "lead-filter-bot"
version = "0.1.0"
description = "AI-powered Telegram bot for qualifying inbound leads for digital agencies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "aiosqlite>=0.19,<1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "openai>=1.30,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.9,<2",
    "fastembed>=0.4,<1",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "faker",
]

[project.scripts]
bot = "apps.bot.main:main"
api = "apps.api.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: FastAPI uses Depends(...) as default argument value by design
# RUF001: project contains Russian text — Cyrillic chars in string literals are intentional
ignore = ["B008", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["core/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
